---
- include_tasks: packages-RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"

- include_tasks: packages-Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install required list of packages
  package:
    state: present
    name: >-
      {{
        [
          "sudo", "bash", "iptables", "openssl", "curl", "ca-certificates",
          "gnupg", "gnupg2", "chrony", "file", "wget", "screen",
          "sysstat", "btop"
        ] + (packages_required_list | default([]))
      }}
  register: _progress_status
  until: _progress_status is succeeded
  delay: 5
  retries: 5

- name: Install extra list of packages
  package:
    state: present
    name:
      - nano
      - lnav
      - zip
      - unzip
      - at
      - git
      - iproute2
  register: _progress_status
  until: _progress_status is succeeded
  delay: 5
  retries: 5
  when: packages_extra | bool
